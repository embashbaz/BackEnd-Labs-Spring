spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  graphql:
    graphiql:
      enabled: false

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.example: INFO