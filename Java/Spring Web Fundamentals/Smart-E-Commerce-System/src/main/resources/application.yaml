spring:
  application:
    name: Smart-E-Commerce-System
  profiles:
    active: dev
  app:
    monitoring:
      slow-threshold-ms: 500

  server:
    port: 8080
  cache:
    type: simple
    cache-names: products,categories,categoryLists,users,reports
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: method
      display-request-duration: true
    api-docs:
      path: /v3/api-docs
  graphql:
    schema:
      printer:
        enabled: true