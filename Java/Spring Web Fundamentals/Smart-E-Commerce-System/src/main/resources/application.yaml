spring:
  application:
    name: Smart-E-Commerce-System
  profiles:
    active: dev

  server:
    port: 8080

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: method
      display-request-duration: true
    api-docs:
      path: /v3/api-docs